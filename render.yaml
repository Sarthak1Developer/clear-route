services:
  - type: web
    name: clearroute-evaluation-api
    runtime: python
    buildCommand: pip install --upgrade "pip>=26.2" "setuptools>=84.1" && pip install -r backend/requirements.txt
    startCommand: python scripts/run_local.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: evaluation
      - key: DEBUG
        value: "false"
