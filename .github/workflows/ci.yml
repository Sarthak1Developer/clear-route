name: ClearRoute CI

on:
  push:
    branches: ["main", "chore/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  backend-tests:
    name: Backend, data and Power BI tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///data/clearroute_app.db
      DB_FALLBACK_SQLITE: "true"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js for frontend startup integration test
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for end-to-end startup test
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Verify committed database and model artifacts
        run: |
          python -c "from pathlib import Path; assert Path('data/clearroute_app.db').is_file(); assert Path('ml/artifacts/preprocessor.joblib').is_file(); print('Database and preprocessor artifacts found')"
          python -c "from pathlib import Path; models=['historical_mean','linear_regression','random_forest','xgboost']; missing=[m for m in models if not Path(f'ml/artifacts/model_{m}.joblib').is_file()]; assert not missing, f'Missing model artifacts: {missing}'; print('All four model artifacts found')"
      - name: Run automated tests
        run: python -m pytest backend/tests bigdata/tests powerbi/tests -v --tb=short
